# Copied from open-telemetry/opentelemetry-ruby-contrib@23afe6508ab8972e58a422e19e99314efc6b6ce9:.rubocop.yml; local changes are marked.
# local: rubocop-minitest and rubocop-rspec are not used, so the Minitest/* overrides are dropped too
plugins:
  - rubocop-rake
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  # local: no extension suggestions in the output
  SuggestExtensions: false
  Exclude:
    - Rakefile
    - "rakelib/**/*"
    - "**/example/*"
    - "bin/instrumentation_generator"
    - "**/**/vendor/bundle/**/*"
    - "**/proto/**"
Bundler/OrderedGems:
  Enabled: false
Lint/ConstantDefinitionInBlock:
  Exclude:
    - "**/*test.rb"
Lint/EmptyBlock:
  Exclude:
    - "**/*test.rb"
Lint/UnusedMethodArgument:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
# local: should_sample? takes the SDK's six keywords
Metrics/ParameterLists:
  Max: 6
Metrics/PerceivedComplexity:
  Enabled: false
# local: a sampler's should_sample? returns a Result, not a boolean (the first two are RuboCop's defaults)
Naming/PredicateMethod:
  WaywardPredicates:
    - infinite?
    - nonzero?
    - should_sample?
Naming/FileName:
  Exclude:
    - "**/opentelemetry-*"
    # local: lib/otel-muzzle.rb is named after the gem so that `require 'otel-muzzle'` works
    - lib/otel-muzzle.rb
Performance/CollectionLiteralInLoop:
  Exclude:
    - "**/Appraisals"
Style/Documentation:
  Exclude:
    - "**/test/**/*"
    - "**/*test*"
Style/DocumentationMethod:
  Enabled: true
  Severity: info
  Exclude:
    - "**/test/**/*"
    - "**/*test*"
Style/FrozenStringLiteralComment:
  Exclude:
    - "**/gemfiles/*"
Style/ModuleFunction:
  Enabled: false
Style/MultilineIfModifier:
  Exclude:
    - "**/test/**/*"
Style/OneClassPerFile:
  Enabled: false
Style/RedundantRegexpEscape:
  Enabled: false
Style/StringLiterals:
  Exclude:
    - "**/gemfiles/*"
Style/SlicingWithRange:
  Enabled: false
Style/CaseLikeIf:
  Enabled: false
## 1.41.1
Gemspec/RequireMFA:
  # We probably want to figure out how to set this up for the organization
  Enabled: false
Layout/LineLength:
  Enabled: true
  # local: the repository's line length
  Max: 130
Layout/EndOfLine:
  EnforcedStyle: lf

Rake/DuplicateTask:
  Enabled: false
