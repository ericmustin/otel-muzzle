name: js

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: js

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.19.0, 20, 22, 24]
        sdk: ['2.9', '2']
        include:
          - node: 22
            sdk: '3'
          - node: 24
            sdk: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - if: matrix.sdk != '3'
        run: |
          # The package list is deliberately word-split into separate arguments.
          # shellcheck disable=SC2046
          npm install --no-save $(node -p "require('./test/sdk-versions.json')['${{ matrix.sdk }}'].join(' ')")
      - run: npm test

  npm-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:npm-install
