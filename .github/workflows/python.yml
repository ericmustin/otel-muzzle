name: python

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        deps: [oldest, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.12
            ${{ matrix.python }}
      # tox 4.67 itself needs Python 3.11+, so it runs on 3.12 and finds the matrix interpreter on PATH.
      - run: python3.12 -m pip install tox==4.67.13
      - run: python3.12 -m tox -e "py${PYTHON_VERSION//./}-test-${{ matrix.deps }}"
        env:
          PYTHON_VERSION: ${{ matrix.python }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install tox==4.67.13
      - run: tox -e lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install tox==4.67.13
      - run: tox -e typecheck
