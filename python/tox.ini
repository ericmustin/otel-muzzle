[tox]
env_list = py3{10,11,12,13,14}-test-{oldest,latest}, lint, typecheck
skip_missing_interpreters = true

[testenv]
package = wheel
deps =
    oldest: -r tests/requirements.oldest.txt
    latest: -r tests/requirements.latest.txt
commands =
    test: pytest {posargs}

[testenv:lint]
skip_install = true
deps = ruff==0.17.4
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
deps =
    -r tests/requirements.latest.txt
    mypy==2.4.1
commands = mypy
